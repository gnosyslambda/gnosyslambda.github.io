</style></head><body style="background:#ffe7e7!important;color:#282c34!important"><div id="root"></div><script>
(function(){
  var images=[];
  for(var i=1;i<=19;i++) images.push('/wedding/assets/gallery'+i+'.jpg');

  function buildSlide(src,idx){
    var slide=document.createElement('div');
    slide.className='swiper-slide';
    var img=document.createElement('img');
    img.src=src;img.alt='gallery '+(idx+1);img.draggable=false;img.loading='lazy';
    slide.appendChild(img);
    return slide;
  }

  function initSwiper(){
    var gallery=document.querySelector('.card.gallery');
    if(!gallery)return false;
    var wrapper=gallery.querySelector('.carousel-wrapper');
    if(!wrapper)return false;

    var container=document.createElement('div');
    container.className='swiper-container-gallery';

    var swiperEl=document.createElement('div');
    swiperEl.className='swiper';
    var swiperWrapper=document.createElement('div');
    swiperWrapper.className='swiper-wrapper';
    images.forEach(function(src,i){swiperWrapper.appendChild(buildSlide(src,i));});
    swiperEl.appendChild(swiperWrapper);

    var prevBtn=document.createElement('div');
    prevBtn.className='swiper-button-prev';
    var nextBtn=document.createElement('div');
    nextBtn.className='swiper-button-next';
    swiperEl.appendChild(prevBtn);
    swiperEl.appendChild(nextBtn);

    var pagination=document.createElement('div');
    pagination.className='swiper-fraction';

    container.appendChild(swiperEl);
    container.appendChild(pagination);
    wrapper.parentNode.insertBefore(container,wrapper);

    new Swiper(swiperEl,{
      effect:'slide',
      speed:350,
      spaceBetween:0,
      grabCursor:true,
      touchRatio:1.2,
      resistance:true,
      resistanceRatio:.6,
      navigation:{nextEl:nextBtn,prevEl:prevBtn},
      pagination:{el:pagination,type:'custom',renderCustom:function(s,cur,tot){
        var span=document.createElement('span');
        span.className='swiper-pagination-current';
        span.textContent=cur;
        pagination.textContent='';
        pagination.appendChild(span);
        pagination.appendChild(document.createTextNode(' / '+tot));
        return '';
      }},
      on:{slideChange:function(){
        var cur=this.realIndex+1,tot=images.length;
        pagination.textContent='';
        var span=document.createElement('span');
        span.className='swiper-pagination-current';
        span.textContent=cur;
        pagination.appendChild(span);
        pagination.appendChild(document.createTextNode(' / '+tot));
      },init:function(){
        var cur=1,tot=images.length;
        pagination.textContent='';
        var span=document.createElement('span');
        span.className='swiper-pagination-current';
        span.textContent=cur;
        pagination.appendChild(span);
        pagination.appendChild(document.createTextNode(' / '+tot));
      }}
    });
    return true;
  }

  function waitAndInit(){
    if(typeof Swiper==='undefined'){setTimeout(waitAndInit,100);return;}
    if(initSwiper())return;
    var obs=new MutationObserver(function(muts,o){
      if(initSwiper()){o.disconnect();}
    });
    obs.observe(document.getElementById('root'),{childList:true,subtree:true});
    setTimeout(function(){obs.disconnect();},15000);
  }

  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',waitAndInit);}
  else{waitAndInit();}
})();
</script></body></html>
