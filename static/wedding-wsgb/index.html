(function(){
  function initAudioControl(){
    var control=document.querySelector('.wedding-audio-control');
    if(!control)return;
    var button=control.querySelector('button');
    var audio=control.querySelector('audio');
    if(!button||!audio)return;
    function setPlaying(isPlaying){
      control.classList.toggle('is-playing',isPlaying);
      button.setAttribute('aria-label',isPlaying?'음악 일시정지':'음악 재생');
    }
    button.addEventListener('click',function(){
      if(audio.paused){
        audio.play().then(function(){setPlaying(true);}).catch(function(){setPlaying(false);});
      }else{
        audio.pause();
        setPlaying(false);
      }
    });
    audio.addEventListener('pause',function(){setPlaying(false);});
    audio.addEventListener('ended',function(){setPlaying(false);});
    audio.addEventListener('play',function(){setPlaying(true);});
    audio.play().then(function(){setPlaying(true);}).catch(function(){setPlaying(false);});
  }
  if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',initAudioControl);}
  else{initAudioControl();}
})();

    var img=document.createElement('img');
    img.src=src;img.alt='gallery '+(idx+1);img.draggable=false;img.loading='lazy';

  function initSwiper(){
    var gallery=document.querySelector('.card.gallery');
    if(!gallery)return false;
    var wrapper=gallery.querySelector('.carousel-wrapper');
    if(!wrapper)return false;

    var container=document.createElement('div');
    container.className='swiper-container-gallery';

    var swiperEl=document.createElement('div');
    swiperEl.className='swiper';
    var swiperWrapper=document.createElement('div');
    swiperWrapper.className='swiper-wrapper';
    images.forEach(function(src,i){swiperWrapper.appendChild(buildSlide(src,i));});
    swiperEl.appendChild(swiperWrapper);

    var prevBtn=document.createElement('div');

      var dot=document.createElement('div');

    function updateDots(activeIdx){
      var half=Math.floor(WINDOW/2);
      for(var d=0;d<dots.length;d++){

      }

  }

  function waitAndInit(){
